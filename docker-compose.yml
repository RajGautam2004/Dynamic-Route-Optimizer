version: '3.8'

services:
  # 1. C++ Routing Engine
  routing-engine:
    build:
      context: ./routing-engine
    ports:
      - "8080:8080"
    networks:
      - optimizer-network

  # 2. Node.js API Backend
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - KAFKA_BROKER=kafka:9092
      - REDIS_URL=redis://redis:6379
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_DATABASE=route_optimizer
    depends_on:
      - routing-engine
      - postgres
      - redis
      - kafka
    networks:
      - optimizer-network

  # 3. PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=route_optimizer
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - optimizer-network

  # 4. Redis Cache
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - optimizer-network

  # 5. Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - optimizer-network

  # 6. Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - optimizer-network

networks:
  optimizer-network:
    driver: bridge
